[package]
name = "yggdrasil-lite-esp32"
version = "0.1.0"
edition = "2024"
description = "Light ESP32 Yggdrasil node: plain TCP peers, overlay status page, send/receive by IPv6"
license = "MPL-2.0"
publish = false

[dependencies]
# Yggdrasil endpoint (no_std, no TLS: peers are tcp:// only)
yggdrasil-lite = { path = "../..", default-features = false }

# Embassy async runtime and networking (same versions as examples/esp32)
embassy-executor = "0.9.0"
embassy-futures = "0.1"
embassy-net = { version = "0.8.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-time = "0.5.0"
embassy-sync = "0.7"
embedded-io-async = "0.7"

# ESP HAL (same paths as examples/esp32; adjust to your checkout)
esp-alloc = { path = "/Users/cleverfox/Projects/esp-hal/esp-alloc" }
esp-backtrace = { path = "/Users/cleverfox/Projects/esp-hal/esp-backtrace", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { path = "/Users/cleverfox/Projects/esp-hal/esp-bootloader-esp-idf" }
esp-hal = { path = "/Users/cleverfox/Projects/esp-hal/esp-hal", features = ["log-04", "unstable"] }
esp-println = { path = "/Users/cleverfox/Projects/esp-hal/esp-println", features = ["log-04"] }
esp-rtos = { path = "/Users/cleverfox/Projects/esp-hal/esp-rtos", features = ["esp-radio", "embassy", "log-04"] }
esp-radio = { path = "/Users/cleverfox/Projects/esp-hal/esp-radio", features = ["log-04", "wifi", "unstable"] }

esp-hal-dhcp-server = "0.2"
heapless = "0.8"
log = "0.4"
rand_core = { version = "0.6", default-features = false }
static_cell = "2.1.0"

[features]
default = ["esp32c6"]
esp32c6 = [
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-radio/esp32c6",
]
esp32 = [
    "esp-backtrace/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-radio/esp32",
]

[profile.dev]
opt-level = 2

[profile.release]
debug = true
lto = "fat"
codegen-units = 1
